[package]
name = "solana-lite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal Solana primitives for wasm32-wasip2 plugins: Pubkey, SPL Mint layout, Token-2022 TLV, transaction wire format."
publish = false

[dependencies]
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"

[lib]
name = "solana_lite"
crate-type = ["rlib"]

[workspace]
